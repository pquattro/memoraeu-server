services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoraeu_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: memoraeu_api
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - SQLITE_PATH=/data/memoraeu.db
    volumes:
      - sqlite_data:/data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  sqlite_data:

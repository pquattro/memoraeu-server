[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoraeu-core"
version = "0.8.0"
description = "Sovereign European MCP memory layer — self-hostable FastAPI server"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Philippe Quattrocchi", email = "pquattro@gmail.com" }]
keywords = ["mcp", "memory", "ai", "fastapi", "qdrant", "sovereign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "aiosqlite==0.20.0",
    "cryptography>=44.0.0",
    "fastapi==0.115.5",
    "httpx==0.28.1",
    "jinja2==3.1.4",
    "mcp>=1.2.0",
    "passlib==1.7.4",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.1.0",
    "qdrant-client==1.14.2",
    "slowapi==0.1.9",
    "sse-starlette>=1.6.5",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
mistral = ["httpx>=0.28.0"]

[project.urls]
Homepage = "https://memoraeu.com"
Repository = "https://github.com/pquattro/memoraeu-server"
Documentation = "https://memoraeu.com/docs"

[project.scripts]
memoraeu-server = "memoraeu.main:app"

[tool.hatch.build.targets.wheel]
packages = ["memoraeu"]
